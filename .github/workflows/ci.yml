name: CI

# Guards the two things that are cheap to check and expensive to miss: that the app still
# builds, and that no new high-severity dependency advisory has crept in. The audit step
# exists because a spreadsheet parser with an unpatched prototype-pollution advisory was
# very nearly added to the frontend — it should never come down to someone checking by hand.

on:
  push:
    branches: [main, huzaifa, development, saqib-colab]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — build, lint, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Fails on HIGH and CRITICAL, with ONE documented, ID-scoped exception below.
      # Moderate/low advisories are reported for visibility but do not block, so routine
      # transitive noise cannot wedge the pipeline.
      #
      # Exception — advisory 1124282 (GHSA-qwww-vcr4-c8h2), react-router-dom:
      # "RSC Mode CSRF Bypass Allows Action Execution Before 400 Response". This targets
      # React Router's Server Components / server-actions integration. This app is a plain
      # Vite SPA — createRoot + BrowserRouter (App.jsx), no createBrowserRouter/RouterProvider
      # data-router API, no RSC, no server actions anywhere in the codebase — so this attack
      # surface does not exist here. No fix is available either way: latest on npm
      # (react-router-dom@7.18.2) is STILL inside the vulnerable range (7.12.0–8.2.0); the
      # only "fix" `npm audit fix --force` offers is downgrading to 7.11.0, seven minor
      # releases back, which is a real regression risk for zero actual security benefit to
      # this app. Revisit and remove this exception once react-router publishes a patched
      # release above 8.2.0 — check with: npm view react-router-dom versions --json
      #
      # The exclusion is scoped to this single advisory ID only; any other high/critical
      # finding — including a new one on this same package — still fails the build.
      - name: Audit (high + critical, with the one documented exception above)
        run: npx better-npm-audit audit --level high --exclude 1124282

      - name: Audit report (informational, never fails)
        if: always()
        run: npm audit || true

  backend:
    name: Backend — import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Compile-only: catches syntax errors and bad imports without needing a database,
      # since create_app() connects to Supabase on boot and no credentials belong in CI.
      - name: Byte-compile all sources
        run: python -m compileall -q app main.py

      - name: Audit Python dependencies (informational)
        if: always()
        run: pip install pip-audit && pip-audit || true
