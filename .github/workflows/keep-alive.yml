name: Backend keep-alive

# Railway's free/trial tier spins the backend down after a period with no incoming requests,
# and the next real request (e.g. an interview candidate's identity-verification termination,
# or just opening the app) then pays a 10-50s "cold start" while the container reboots. This
# has nothing to do with how many people are using the app — it's about IDLE TIME between
# requests, and a single active tester produces exactly the gaps that trigger it.
#
# This workflow pings the deployed backend's own health-check endpoint often enough that it
# never sits idle long enough to be put to sleep, so every REAL request — violations, identity
# checks, interview creation, all of it — gets a warm, fast server.
#
# IMPORTANT: GitHub only evaluates `schedule:` triggers from the workflow file as it exists on
# the repository's DEFAULT branch. Committing this file on a feature branch alone will not
# start the pings — it has to reach the default branch (main) before the cron actually fires.

on:
  schedule:
    # Every 10 minutes — comfortably inside Railway's inactivity window, without pinging so
    # often it wastes Action minutes for no added benefit.
    - cron: '*/10 * * * *'
  # Lets anyone trigger a ping manually from the Actions tab to sanity-check the URL/endpoint
  # without waiting for the schedule.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # continue-on-error: a single missed ping (backend mid-deploy, a transient network
        # blip) must never fail this workflow run and spam a "workflow failed" notification —
        # the next scheduled ping a few minutes later self-heals it either way.
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://interviewer-ai-backend-production.up.railway.app/health"
