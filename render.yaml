services:
  - type: web
    name: interviewer-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Bypasses main.py's uvicorn.run(..., reload=True) — reload is a dev-only file-watcher
    # feature that has no business running in production. $PORT is injected by Render.
    startCommand: uvicorn app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Secrets — set these manually in the Render dashboard (Settings > Environment).
      # sync: false means Render will NOT read a value from this file; it just reserves
      # the key so you're prompted for it once, and it's never committed to git.
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: MIXTRAL_API_KEY
        sync: false
      - key: WHISPER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: EMAIL_MODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      # Gmail-API delivery (see backend/scripts/gmail_oauth_setup.py). Required because
      # Render's free tier blocks outbound SMTP — set EMAIL_MODE to gmail_api here (not
      # smtp), and provide these three from that script's output.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      # Non-secret, safe to set directly here.
      - key: AI_MODE
        value: api
      # Used to build links inside emails (OTP invites, approval notices). Without this,
      # it silently defaults to http://localhost:5173 — meaning every "Log in & Start
      # Interview" email button would point at the candidate's own machine instead of the
      # real site. Update this if the Vercel URL ever changes (e.g. a custom domain).
      - key: APP_BASE_URL
        value: https://sit-interviewer.vercel.app
