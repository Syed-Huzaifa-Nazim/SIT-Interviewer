# Railway config-as-code for the backend service. This file must live inside the
# service's Root Directory (set to "backend" in the Railway dashboard), the same way
# render.yaml used rootDir: backend.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Bypasses main.py's uvicorn.run(..., reload=True) — reload is a dev-only file-watcher
# feature that has no business running in production. $PORT is injected by Railway.
startCommand = "uvicorn app:create_app --factory --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
